# Genera Plano.xcodeproj con XcodeGen:  brew install xcodegen && xcodegen
name: Plano
options:
  bundleIdPrefix: app.plano
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Plano:
    type: application
    platform: iOS
    sources:
      - path: Plano
    scheme: {} # esquema compartido (necesario para xcodebuild en CI)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.plano.Plano
        INFOPLIST_FILE: Plano/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: XXXXXXXXXX  (pon tu equipo personal en Xcode > Signing)
    info:
      path: Plano/Info.plist
      properties:
        CFBundleDisplayName: Plano
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Plano usa la cámara y el LiDAR para escanear las estancias y dibujar su plano.
        UIRequiredDeviceCapabilities: [arkit]
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIAppFonts: [SpaceGrotesk.ttf, JetBrainsMono.ttf]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.plano.package
            UTTypeDescription: Paquete Plano
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [plano]
