name: pages

# Publica el prototipo web (carpeta web/) en GitHub Pages copiándolo a la rama gh-pages,
# que es la fuente de Pages del repositorio: https://polete-detoned.github.io/plano.app/
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar web/ a gh-pages
        run: |
          mkdir site
          cp -R web/. site/
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publicar prototipo web (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
