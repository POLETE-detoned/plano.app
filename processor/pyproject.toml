[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plano-processor"
version = "0.1.0"
description = "Procesador de escritorio de Plano: importa paquetes .plano y exporta planos (DXF; IFC, PDF y nube en próximas entregas)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "ezdxf>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
plano = "plano.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
